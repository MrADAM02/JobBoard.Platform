name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore JobBoard/JobBoard.sln

      - name: Build
        run: dotnet build JobBoard/JobBoard.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test JobBoard/JobBoard.sln --no-build --configuration Release

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: jobboard-web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: jobboard-web
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: jobboard-web
        run: pnpm run test

      - name: Build
        working-directory: jobboard-web
        run: pnpm run build

  publish:
    name: Publish API image to GHCR
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./JobBoard
          push: true
          tags: |
            ghcr.io/mradam02/jobboard-api:latest
            ghcr.io/mradam02/jobboard-api:sha-${{ github.sha }}

  deploy:
    name: Deploy API to server
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}

          script: |
            set -e

            cd /opt/jobboard

            export API_VERSION=sha-${{ github.sha }}

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            docker image prune -f
