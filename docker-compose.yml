services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - copy .env.example to .env first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./JobBoard
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=jobboard;Username=postgres;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - copy .env.example to .env first}
      # No fallback on purpose - a known JWT signing secret baked into the
      # compose file is exactly the kind of thing that ends up running for
      # real by accident. Copy .env.example to .env first; compose refuses to
      # start otherwise.
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET must be set - copy .env.example to .env first}
      Cors__AllowedOrigins__0: http://localhost:3000
    ports:
      - "5000:8080"
    volumes:
      - api-uploads:/app/wwwroot/uploads

  web:
    build:
      context: ./jobboard-web
    depends_on:
      - api
    environment:
      # Host-mapped URLs, not Docker-internal service names - with ssr:false
      # these requests are made by the browser on the host, not container-to-container.
      NUXT_PUBLIC_API_BASE: http://localhost:5000/api
      NUXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  api-uploads:
